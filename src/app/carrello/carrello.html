<div class="container mt-4">
  <h2>Gestione Carrello</h2>

  <div class="card mb-4">
    <div class="card-body">
      <h5 class="card-title">Filtra Risultati</h5>
      <div class="row g-3">
        <div class="col-md-3">
          <input type="number" class="form-control" placeholder="Cerca per ID" #idInput />
          <button class="btn btn-primary btn-sm mt-2" (click)="cercaPerId(idInput.valueAsNumber)">
            Cerca ID
          </button>
        </div>
        <div class="col-md-3">
          <input type="number" class="form-control" placeholder="Prezzo Totale" #prezzoInput />
          <button
            class="btn btn-success btn-sm mt-2"
            (click)="filtraPerPrezzo(prezzoInput.valueAsNumber)"
          >
            Filtra Prezzo
          </button>
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button class="btn btn-secondary btn-sm mt-2" (click)="resetFiltri(idInput, prezzoInput)">
            Rimuovi Filtri
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-hover border">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Quantità</th>
          <th>Prezzo Totale</th>
          <th>Azioni</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of listCarrello">
          <td>{{ item.id }}</td>
          <td>{{ item.quantita }}</td>
          <td>{{ item.prezzoTotale | currency: 'EUR' }}</td>
          <td>
            <button class="btn btn-danger btn-sm">Elimina</button>
          </td>
        </tr>
        <tr *ngIf="listCarrello.length === 0">
          <td colspan="4" class="text-center">Nessun elemento nel carrello.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
