<div class="controls">
  <div class="search-group">
    <input type="text" #inputTitolo placeholder="Cerca per titolo...">
    <button (click)="cercaPerTitolo(inputTitolo.value)">Cerca</button>
  </div>

  <div class="search-group">
    <select #selectLetta>
      <option [value]="true">Lette</option>
      <option [value]="false">Non Lette</option>
    </select>
    <button (click)="cercaPerStato(selectLetta.value === 'true')">Filtra Stato</button>
  </div>

  <div class="search-group">
    <input type="text" #inputTipo placeholder="Tipo (es. INFO)">
    <input type="text" #inputPriorita placeholder="Priorità (es. ALTA)">
    <button (click)="cercaPerTipoEPriorita(inputTipo.value, inputPriorita.value)">Filtra Doppio</button>
  </div>

  <button class="btn-all" (click)="caricaTutte()">Mostra Tutte le Notifiche</button>
</div>

@for (notifica of listNotifica; track $index) {
  <div class="notifica-card">
    <div class="notifica-header">
      <strong>{{notifica.titolo}}</strong>
      <span class="priorita-tag">{{notifica.priorita}}</span>
    </div>

    <div class="messaggio">
      <em>{{notifica.tipo}}</em>: {{notifica.messaggio}}
    </div>

    <div class="footer">
      <span>Data: {{notifica.dataCreazione | date:'short'}}</span>
      <span>Stato: <b>{{notifica.letta ? 'Letta' : 'Da leggere'}}</b></span>
    </div>
  </div>
} @empty {
  <p style="text-align: center; color: #999;">Nessuna notifica presente in archivio.</p>
}
