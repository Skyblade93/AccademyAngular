<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

<div class="page">
  <div class="search-box">
    <input type="text" placeholder="Inserisci Cognome Destinatario" #receiverSurname>
    <button (click)="findByReceiverSurname(receiverSurname.value)">
      CERCA
    </button>
  </div>

  <!--<div class="search-box">
    <input type="text" placeholder="senderSurname" #senderSurname>
    <button (click)="findBySenderSurname(senderSurname.value)">
      CERCA
    </button>
  </div>-->

  <table class="item">
    <tr>
      <th>ID</th>
      <th>Receiver</th>
      <th>Sender</th>
      <th>Height</th>
      <th>Weight</th>
      <th>Operazioni</th>
    </tr>
    <tr>
      <td>{{parcel.id}}</td>
      <td>{{parcel.receiverName}} {{parcel.receiverSurname}}</td>
      <td>{{parcel.senderName}} {{parcel.senderSurname}}</td>
      <td>{{parcel.height}}</td>
      <td>{{parcel.weight}}</td>
      <td>U | D</td>
    </tr>
  </table>
</div>
