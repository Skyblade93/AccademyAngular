<p>{{nome}} puzza</p>

<button (click)="aggiungi1()">aggiungi 1 numero</button>
<h2>hai cliccato il bottone {{numero}} volte</h2>

<input type="text" [(ngModel)]="nome" name="nome">

<div class="lista">
@for (item of lista; track item) {
  <span class="item">{{ item }}</span>
}
</div>

<div class="flex">
<button (click)="rimuovi1()">Elimina l' ultimo valore</button>



<button (click)="bool= false">Vedi Persona</button>



<button (click)="elimina()">Elimina Persona</button>

</div>

@if (bool == false) {

  <h3>{{user2.nome}}   {{user2.cognome}}</h3>
}


<form [formGroup]="userForm" (ngSubmit)="onSubmit()">
  <input type="text" formControlName="nome">
  <input type="text" formControlName="cognome">
  <button type="submit">Salva Persona</button>
</form>

@for (persona of ListaPersona; track $index) {
  <p>{{ persona.nome }} {{ persona.cognome }} index: {{ $index }}</p>
}
