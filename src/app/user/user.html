<!-- 🔥 Utente selezionato -->
@if (selectedUser()) {
  <div class="item">
    {{ selectedUser()?.name }}
    {{ selectedUser()?.description }}
    {{ selectedUser()?.id }}
  </div>
}

<!-- 🔥 Popup errore -->
@if (isPopupVisible()) {
  <div class="overlay">
    <div class="popup">
      <h2>User non trovato</h2>
      <button (click)="togglePopup()">Chiudi</button>
    </div>
  </div>
}

<!-- 🔥 Ricerca per ID -->
<div>
  <input type="text" placeholder="id" #id>
  <button (click)="ottieniElemento(+id.value)">
    Ottieni elemento
  </button>
</div>

<!-- 🔥 Lista utenti -->
<div class="container">
  @for (item of sortedUsers(); track item.id) {
    <div class="item">
      {{ item.name }}
      {{ item.description }}
      {{ item.id }}

      <button (click)="deleteUser(item.id)">
        Elimina
      </button>
    </div>
  }
</div>

<!-- 🔥 Form inserimento -->
<div>
  <div>Inserisci un nuovo utente</div>

  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <input
      placeholder="nome"
      type="text"
      formControlName="nome"
    />

    <input
      placeholder="descrizione"
      type="text"
      formControlName="descrizione"
    />

    <button type="submit">Salva Persona</button>
  </form>

  <!-- 🔥 Count reattivo -->
  <div>{{ count() }}</div>
</div>
