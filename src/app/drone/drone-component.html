<div class="page-container">

  <div class="action-bar">
    <button type="button" (click)="togglePopup()" class="btn-filter-toggle">
      🔍 CERCA PER MARCA (PARZIALE)
    </button>
  </div>

  @if (isPopupOpen) {
    <div class="overlay">
      <div class="popup-card animate-in">
        <h3>Filtro Avanzato</h3>
        <p>Inserisci anche solo una parte della marca</p>
        
        <input type="text" [(ngModel)]="filtroMarca" placeholder="Es. 'dj' per trovare 'DJI'..." class="search-input">

        <div class="popup-actions">
          <button (click)="applicaFiltro()" class="btn-action-confirm">APPLICA</button>
          <button (click)="togglePopup()" class="btn-action-cancel">ANNULLA</button>
        </div>
      </div>
    </div>
  }

  <div class="main-card">
    <h3 class="card-title">Gestione Flotta Droni</h3>
    <form #droneForm="ngForm" (ngSubmit)="salvaDrone(droneForm)" class="horizontal-layout">
      <input type="text" name="marca" [(ngModel)]="droneInModifica.marca" placeholder="Marca" class="form-input" required>
      <input type="text" name="modello" [(ngModel)]="droneInModifica.modello" placeholder="Modello" class="form-input" required>
      <input type="text" name="seriale" [(ngModel)]="droneInModifica.codiceSeriale" placeholder="Seriale" class="form-input" required>
      <input type="number" name="batt" [(ngModel)]="droneInModifica.livelloBatteria" placeholder="Batt %" class="form-input tiny" required>
      
      <div class="btn-set">
        <button type="submit" class="btn-primary" [disabled]="!droneForm.valid">
          {{ isModifica ? 'AGGIORNA' : 'REGISTRA' }}
        </button>
        <button type="button" (click)="annulla()" class="btn-secondary">SVUOTA</button>
      </div>
    </form>
  </div>

  <div class="results-grid">
    @for (d of listaFiltrata; track d.id) {
      <div class="drone-item">
        <div class="info">
          <strong>{{d.marca}}</strong> - {{d.modello}}
          <small>SN: {{d.codiceSeriale}}</small>
        </div>
        <div class="actions">
          <button (click)="selezionaPerModifica(d)" class="btn-small-edit">✎</button>
          <button (click)="eliminaDrone(d.id)" class="btn-small-del">✖</button>
        </div>
      </div>
    }
  </div>
</div>
