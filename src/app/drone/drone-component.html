<div class="page-container">
  <div class="action-bar">
    <button (click)="togglePopup()" class="btn-filter-toggle">🔍 FILTRA DRONI</button>
  </div>

  <div *ngIf="isPopupOpen" class="overlay">
    <div class="popup-card">
      <h3>Ricerca Rapida</h3>
      <input type="text" [(ngModel)]="filtroMarca" class="search-input" placeholder="Scrivi marca o modello...">
      <div class="popup-buttons">
        <button (click)="applicaFiltro()" class="btn-primary">APPLICA</button>
        <button (click)="togglePopup()" class="btn-secondary">CHIUDI</button>
      </div>
    </div>
  </div>

  <div class="main-card">
    <h3>Registra Nuovo Drone</h3>
    <div class="horizontal-layout">
      <input type="text" [(ngModel)]="droneInModifica.marca" placeholder="Marca (es. DJI)" class="form-input">
      <input type="text" [(ngModel)]="droneInModifica.modello" placeholder="Modello (es. Mavic)" class="form-input">
      <input type="text" [(ngModel)]="droneInModifica.codiceSeriale" placeholder="Seriale SN" class="form-input">
      <input type="number" [(ngModel)]="droneInModifica.livelloBatteria" placeholder="Batteria %" class="form-input tiny">
      <button (click)="salvaDrone()" class="btn-primary">SALVA DRONE</button>
    </div>
  </div>

  <div class="results-grid">
    <div *ngFor="let d of listaFiltrata" class="drone-item">
      <div class="drone-info">
        <div class="drone-title">{{ d.marca }} {{ d.modello }}</div>
        <div class="drone-sn">SN: {{ d.codiceSeriale }}</div>
        
        <div class="battery-section">
          <span>Stato Energia: {{ d.livelloBatteria }}%</span>
          <div class="battery-container">
            <div class="battery-fill" 
                 [style.width.%]="d.livelloBatteria"
                 [style.background-color]="d.livelloBatteria < 20 ? '#ff4d4d' : '#2ecc71'">
            </div>
          </div>
        </div>
      </div>
      
      <div class="drone-actions">
        <button (click)="selezionaPerModifica(d)" class="btn-edit">✏️ Modifica</button>
        <button (click)="eliminaDrone(d.id)" class="btn-delete">❌ Elimina</button>
      </div>
    </div>
  </div>
</div>
