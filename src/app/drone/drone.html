<div class="page-container">
  <h2>Gestione Droni</h2>

  <div class="form-container">
    <form #droneForm="ngForm" (ngSubmit)="salvaDrone(droneForm)">
      <input type="text" name="marca" [(ngModel)]="droneInModifica.marca" placeholder="Marca" required>
      <input type="text" name="modello" [(ngModel)]="droneInModifica.modello" placeholder="Modello" required>
      <input type="text" name="seriale" [(ngModel)]="droneInModifica.codiceSeriale" placeholder="Codice Seriale" required>
      <input type="number" name="batteria" [(ngModel)]="droneInModifica.livelloBatteria" placeholder="Batteria %" required>
      
      <button type="submit" class="btn-save" [disabled]="!droneForm.valid">
        {{ isModifica ? 'AGGIORNA' : 'REGISTRA' }}
      </button>
    </form>
  </div>

  <div class="drone-grid">
    <div class="drone-card" *ngFor="let drone of listaDroni">
      <h3>{{ drone.marca }} {{ drone.modello }}</h3>
      <p>SN: {{ drone.codiceSeriale }}</p>
      <p>Batteria: {{ drone.livelloBatteria }}%</p>
      <button (click)="selezionaPerModifica(drone)">Modifica</button>
      <button (click)="eliminaDrone(drone.id)" class="btn-delete">Elimina</button>
    </div>
  </div>
</div>
