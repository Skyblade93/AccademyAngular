<div class="page-container">
    <h2 class="section-title">Gestione Parco Droni</h2>

    <div class="form-container">
        <form #droneForm="ngForm" (ngSubmit)="salvaDrone(droneForm)">
            <div class="form-group">
                <input type="text" name="marca" [(ngModel)]="droneInModifica.marca" placeholder="Marca (es. DJI)" required>
                <input type="text" name="modello" [(ngModel)]="droneInModifica.modello" placeholder="Modello (es. Mavic)" required>
                <input type="number" name="batteria" [(ngModel)]="droneInModifica.livelloBatteria" placeholder="Batteria %" required>
                
                <button type="submit" class="btn-save">
                    {{ isModifica ? 'Aggiorna Drone' : 'Aggiungi Drone' }}
                </button>
                <button type="button" *ngIf="isModifica" (click)="annulla()" class="btn-cancel">Annulla</button>
            </div>
        </form>
    </div>

    <hr>

    <div class="drone-grid">
        <div class="drone-card" *ngFor="let drone of listaDroni">
            <div class="drone-info">
                <h3>{{ drone.marca }} {{ drone.modello }}
                    <span class="drone-status-tag" [ngClass]="drone.livelloBatteria > 20 ? 'tag-at_base' : 'tag-repairing'">
                        {{ drone.livelloBatteria }}% Batt.
                    </span>
                </h3>
                <p><strong>ID Sistema:</strong> {{ drone.id }}</p>
            </div>
            <div class="card-actions">
                <button (click)="selezionaPerModifica(drone)" class="btn-edit">Modifica</button>
                <button (click)="eliminaDrone(drone.id)" class="btn-delete">Elimina</button>
            </div>
        </div>
    </div>

    <div *ngIf="listaDroni.length === 0" class="empty-msg">
        Nessun drone presente nel database. Aggiungine uno sopra!
    </div>
</div>
