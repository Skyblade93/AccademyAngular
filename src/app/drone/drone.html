<div class="drone-dashboard">
  <header class="dashboard-header">
    <h1>Drone Control Center</h1>
    <div class="system-status">
      <span class="dot"></span> Online
    </div>
  </header>

  <div class="main-content">
    <aside class="control-panel">
      <h2>{{ isModifica ? 'Modifica Unità' : 'Nuova Missione' }}</h2>
      <form #droneForm="ngForm" (ngSubmit)="salvaDrone(droneForm)">
        <div class="form-field">
          <input type="text" name="modello" [(ngModel)]="droneInModifica.modello" required placeholder="Modello velivolo">
        </div>
        <div class="form-field">
          <input type="text" name="marca" [(ngModel)]="droneInModifica.marca" required placeholder="Produttore">
        </div>
        <div class="form-field">
          <input type="number" name="livelloBatteria" [(ngModel)]="droneInModifica.livelloBatteria" required placeholder="Batteria %">
        </div>
        
        <button type="submit" [disabled]="!droneForm.valid" class="btn-action">
          {{ isModifica ? 'AGGIORNA' : 'REGISTRA' }}
        </button>
        <button type="button" *ngIf="isModifica" (click)="annulla()" class="btn-cancel">X</button>
      </form>
    </aside>

    <section class="monitoring-grid">
      <div *ngFor="let d of listaDroni" class="drone-card">
        <div class="card-header">
          <span class="id">#{{ d.id }}</span>
          <div class="battery-icon" [style.color]="d.livelloBatteria < 20 ? 'red' : '#00ff88'">
            {{ d.livelloBatteria }}%
          </div>
        </div>
        <div class="card-body">
          <h3>{{ d.modello }}</h3>
          <p>{{ d.marca }}</p>
        </div>
        <div class="card-footer">
          <button (click)="selezionaPerModifica(d)" class="btn-icon">✏️</button>
          <button (click)="eliminaDrone(d.id)" class="btn-icon del">🗑️</button>
        </div>
      </div>
    </section>
  </div>
</div>
